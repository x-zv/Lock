<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lock AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --line: #2a2a2a;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #7ae5b3;
      --user-bg: rgba(45, 109, 79, 0.2);
      --user-line: rgba(45, 109, 79, 0.5);
      --user-text: #b9e7ca;
      --error: #ff9a9a;
      --error-line: rgba(204, 51, 51, 0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .logo {
      font-size: 1.5em;
      font-weight: 300;
      letter-spacing: 2px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.35em;
      line-height: 1;
    }
    .logo-img {
      display: block;
      width: 52px;
      height: 52px;
      max-width: 52px;
      max-height: 52px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .header-icons { display: flex; align-items: center; gap: 12px; }

    .mode-indicator { font-size: 0.8em; color: var(--muted); }
    .mode-indicator.expert { color: var(--accent); }
    .mode-indicator.pro { color: #4a9eff; }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 2px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.05em;
      transition: all 0.2s ease;
    }
    .icon-btn:hover { border-color: #555; color: #ccc; }
    .icon-btn.pro-only { display: none; border-color: var(--accent); color: var(--accent); font-weight: bold; }
    .icon-btn.pro-only.show { display: inline-block; }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 30px 50px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome { text-align: center; padding: 40px 0; }
    .welcome h1 { font-size: 2.4em; font-weight: 300; margin-bottom: 12px; color: #fff; letter-spacing: 1px; }
    .welcome p { font-size: 1.05em; color: var(--muted); }

    .message { display: flex; animation: slideIn 0.25s ease-out; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user { justify-content: flex-end; }
    .message.ai { justify-content: flex-start; }

    .bubble {
      max-width: 70%;
      padding: 14px 18px;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 0.95em;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message.user .bubble { background: transparent; border: none; color: #c8c8d0; }
    .message.ai .bubble { background: transparent; border: none; color: #c8c8d0; }
    .message.ai.error .bubble { background: transparent; border: none; color: #c8c8d0; }
    .message.ai.success .bubble { background: transparent; border: none; color: #c8c8d0; }

    /* 대화 말풍선: 흰색 */
    .message .bubble { background: transparent; border: none; color: #c8c8d0; }
    .message.ai.error .bubble { color: #c8c8d0; }
    .teach-link { color: #1f5f45; }
    .bubble-actions .teach-link { color: #1f5f45; }

    .bubble-actions { margin-top: 8px; display: flex; gap: 14px; }

    .teach-link {
      color: #a8d5ba;
      text-decoration: underline;
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .input-section {
      padding: 20px 50px 30px;
      border-top: 1px solid var(--line);
      background: var(--bg);
      position: sticky;
      bottom: 0;
    }

    .input-wrapper { display: flex; gap: 12px; }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 14px 18px;
      font-size: 1em;
      background: transparent;
      border: 2px solid #333;
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      transition: border-color 0.2s ease;
    }
    input::placeholder, textarea::placeholder { color: #666; }
    input:focus, textarea:focus { outline: none; border-color: #555; }
    textarea { resize: vertical; min-height: 90px; }

    .send-btn {
      width: 52px;
      background: transparent;
      border: 2px solid #333;
      color: #888;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.3em;
      transition: all 0.2s ease;
    }
    .send-btn:hover { border-color: #555; color: #ccc; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal.show { display: flex; }

    .modal-content {
      background: var(--panel);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .modal-title {
      font-size: 1.6em;
      font-weight: 300;
      margin-bottom: 24px;
      text-align: center;
      color: #fff;
      letter-spacing: 1px;
    }

    .modal-input { margin-bottom: 14px; }

    .modal-error {
      min-height: 1.2em;
      margin-bottom: 12px;
      color: var(--error);
      font-size: 0.9em;
      text-align: center;
    }

    .modal-buttons { display: flex; gap: 12px; justify-content: center; }

    .modal-btn {
      padding: 11px 26px;
      border: 2px solid #333;
      background: transparent;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .modal-btn:hover { border-color: #555; background: rgba(255, 255, 255, 0.04); }
    .modal-btn.primary { border-color: #2d6d4f; color: #a8d5ba; }
    .modal-btn.primary:hover { background: rgba(45, 109, 79, 0.2); }

    .popup-content {
      background: #0f0f0f;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 32px 30px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }
    .popup-title { font-size: 1.2em; font-weight: 600; color: var(--error); margin-bottom: 14px; }
    .popup-body { color: #cfcfcf; line-height: 1.6; margin-bottom: 8px; }
    .popup-countdown { color: var(--muted); font-size: 0.9em; margin-bottom: 22px; min-height: 1.2em; }

    .terms-list {
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 20px;
      border: 1px solid #333;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
    }
    .term-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      border-bottom: 1px solid #222;
    }
    .term-item:last-child { border-bottom: none; }
    .term-name { color: #d3d3d3; font-weight: 500; word-break: break-all; }
    .term-delete-btn {
      padding: 5px 12px;
      border: 1px solid #a33;
      background: transparent;
      color: #e55;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85em;
      flex-shrink: 0;
    }
    .term-delete-btn:hover { background: rgba(204, 51, 51, 0.15); }
    .empty-message { text-align: center; padding: 28px; color: var(--muted); }

    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f0f0f;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 0.95em;
      z-index: 3000;
      display: none;
      max-width: 90%;
      text-align: center;
      line-height: 1.5;
    }
    .toast.show { display: block; }

    .attach-btn {
      width: 52px;
      background: transparent;
      border: 2px solid #333;
      color: #888;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.5em;
      line-height: 1;
      transition: all 0.2s ease;
    }
    .attach-btn:hover { border-color: #555; color: #ccc; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      pointer-events: none;
    }
    .attach-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      header { padding: 15px 25px; }
      .chat-container { padding: 20px 25px; }
      .input-section { padding: 15px 25px 20px; }
      .bubble { max-width: 90%; }
    }
    @media (max-width: 480px) {
      header { padding: 12px 15px; }
      .logo { font-size: 1.2em; }
      .logo-img { width: 46px; height: 46px; max-width: 46px; max-height: 46px; }
      .chat-container { padding: 15px; }
      .input-section { padding: 12px 15px 15px; }
      .bubble { max-width: 95%; font-size: 0.9em; }
      .welcome h1 { font-size: 1.8em; }
      .modal-content { padding: 28px 20px; }
    }

    * { scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><img class="logo-img" src="logo.png" alt="" />lock</div>
    <div class="header-icons">
      <span class="mode-indicator" id="modeIndicator">Normal</span>
      <button class="icon-btn pro-only" id="manageBtn" title="용어 관리">L</button>
      <button class="icon-btn" id="settingsBtn" title="모드 전환">⚙</button>
    </div>
  </header>

  <div class="chat-container" id="chat">
    <div class="welcome" id="welcome">
      <h1>How can I help?</h1>
      <p>Ask about any AI term or concept</p>
    </div>
  </div>

  <div class="input-section">
    <div class="input-wrapper">
      <button class="attach-btn" id="clipBtn" type="button" title="클립보드 코드 분석">+</button>
      <input id="searchInput" type="text" maxlength="200" placeholder="Enter a term..." autocomplete="off" />
      <button class="send-btn" id="sendBtn" type="button">→</button>
    </div>
  </div>

  <!-- 비밀번호 모달 (Expert / Pro 공용) -->
  <div class="modal" id="passwordModal">
    <div class="modal-content">
      <div class="modal-title" id="passwordTitle">Expert Access</div>
      <input id="passwordInput" type="password" class="modal-input" placeholder="Password" autocomplete="off" maxlength="100" />
      <div class="modal-error" id="passwordError"></div>
      <div class="modal-buttons">
        <button class="modal-btn primary" id="passwordSubmit" type="button">Enter</button>
        <button class="modal-btn" id="passwordCancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- 5회 실패 팝업 (다크 테마) -->
  <div class="modal" id="lockPopup">
    <div class="popup-content">
      <div class="popup-title">5 times wrong password entered</div>
      <div class="popup-body">Normal 모드로 돌아갑니다.</div>
      <div class="popup-countdown" id="lockCountdown"></div>
      <div class="modal-buttons">
        <button class="modal-btn" id="lockOk" type="button">확인</button>
      </div>
    </div>
  </div>

  <!-- 용어 가르치기 / 수정 -->
  <div class="modal" id="teachModal">
    <div class="modal-content">
      <div class="modal-title" id="teachTitle">Teach me</div>
      <input id="newWord" type="text" class="modal-input" maxlength="200" placeholder="word" autocomplete="off" />
      <textarea id="newDefinition" class="modal-input" maxlength="2000" placeholder="Enter the definition..."></textarea>
      <div class="modal-error" id="teachError"></div>
      <div class="modal-buttons">
        <button class="modal-btn primary" id="teachSave" type="button">Save</button>
        <button class="modal-btn" id="teachCancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Pro: 용어 관리 -->
  <div class="modal" id="manageModal">
    <div class="modal-content">
      <div class="modal-title">Manage Terms</div>
      <div class="terms-list" id="termsList"></div>
      <div class="modal-buttons">
        <button class="modal-btn" id="manageRefresh" type="button">새로고침</button>
        <button class="modal-btn" id="manageClose" type="button">Close</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ===== 설정 =====
    // Supabase 프로젝트 주소와 anon 키를 넣으세요. (아래 설명 참고)
    const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
    const TABLE_URL = `${SUPABASE_URL}/rest/v1/terms`;
    const USE_SERVER = !SUPABASE_URL.includes("YOUR-PROJECT");
    const LOCAL_TERMS_KEY = "lockai_local_terms";

    const EXPERT_PASSWORD = "password";
    const PRO_PASSWORD = "lockunknown";
    const MAX_WRONG_ATTEMPTS = 5;
    const LOCKOUT_SECONDS = 30;
    const SESSION_TIMEOUT_MS = 10 * 60 * 1000;
    const MAX_INPUT_LEN = 200;
    const MAX_DEFINITION_LEN = 2000;
    const MAX_CUSTOM_TERMS = 500;
    const STORAGE_STATE = "lockai_auth_state";

    const DEFAULT_TERMS = {
      "AI": "AI is a short form of artificial intelligence. Artificial Intelligence is a computer system that learns patterns from data and makes decisions automatically. Instead of being explicitly programmed, AI improves by analyzing examples and recognizing patterns to solve problems. Common examples include Netflix recommendations, spam filters, and voice assistants—all working by detecting patterns in data.",
      "Algorithm": "Algorithm is a step-by-step procedure to solve a problem or perform a computation.",
      "Deep Learning": "Deep Learning is a machine learning technique that uses artificial neural networks stacked in multiple layers. It automatically learns patterns from large amounts of data.",
      "Backpropagation": "Backpropagation is an algorithm that calculates gradients by propagating errors backward through a neural network to update weights.",
      "Batch": "Batch is a subset of data used in one iteration of model training.",
      "Bias": "Bias is a parameter that shifts the output of a neuron; also refers to systematic errors in model predictions.",
      "Classification": "Classification is a supervised learning task that assigns data to predefined categories or classes.",
      "CNN": "CNN is a neural network architecture specialized for processing image data using convolutional layers.",
      "Clustering": "Clustering is an unsupervised learning technique that groups similar data points together without predefined labels.",
      "Dataset": "Dataset is a collection of data samples used to train, validate, or test machine learning models.",
      "Decision Tree": "Decision Tree is a tree-structured algorithm that makes decisions by recursively splitting data based on feature values.",
      "Embedding": "Embedding is a representation of words, images, or other data as vectors in a continuous space.",
      "Epoch": "Epoch is one complete pass through the entire training dataset during model training.",
      "Feature": "Feature is an individual measurable property or characteristic of the data used by the model for learning.",
      "Fine-tuning": "Fine-tuning is adapting a pre-trained model to a specific task by training it on task-specific data with a low learning rate.",
      "GAN": "GAN (Generative Adversarial Network) is a neural network architecture with a generator and discriminator that learn adversarially to create realistic synthetic data.",
      "Gradient": "Gradient is the slope of a loss function; used to update model weights during optimization.",
      "Gradient Descent": "Gradient Descent is an optimization algorithm that iteratively reduces loss by moving in the direction of steepest descent.",
      "Hallucination": "Hallucination is when an AI generates plausible-sounding but factually incorrect information.",
      "Hyperparameter": "Hyperparameter is a parameter set before training begins that controls the learning process (e.g., learning rate, batch size).",
      "Inference": "Inference is the process of using a trained model to make predictions on new, unseen data.",
      "Input": "Input is data fed into a neural network or machine learning model.",
      "Kernel": "Kernel is a small matrix or filter used in convolutional layers to scan and extract features from images.",
      "Label": "Label is the correct answer or target value associated with training data in supervised learning.",
      "Loss Function": "Loss Function is a mathematical function that measures the difference between predicted and actual values.",
      "LSTM": "LSTM (Long Short-Term Memory) is a type of recurrent neural network designed to learn long-term dependencies in sequential data.",
      "Machine Learning": "Machine Learning is a branch of AI focused on creating algorithms that learn patterns from data without explicit programming.",
      "Model": "Model is a mathematical representation of learned patterns that can make predictions on new data.",
      "Neural Network": "Neural Network is a computational structure inspired by biological neurons, consisting of interconnected layers of nodes.",
      "Optimization": "Optimization is the process of adjusting model parameters to minimize loss and improve performance.",
      "Overfitting": "Overfitting occurs when a model learns the training data too well, including its noise, and performs poorly on new data.",
      "Regression": "Regression is a supervised learning task that predicts continuous numerical values.",
      "RNN": "RNN (Recurrent Neural Network) is a neural network architecture designed to process sequential data by maintaining hidden states.",
      "Training": "Training is the process of feeding data to a model and adjusting its parameters to learn patterns."
    };

    // ===== 상태 =====
    let mode = "normal"; // normal | expert | pro
    let lastActivity = Date.now();
    let pendingRole = null;
    let countdownTimer = null;
    let customTerms = {};                      // 서버에서 받아온 공유 용어
    let allTerms = { ...DEFAULT_TERMS };
    let authState = loadAuthState();           // 비밀번호 실패/잠금 상태 (이 브라우저만)
    let editingTerm = null;                    // 수정 중인 기존 용어 이름

    // ===== 유틸 =====
    function sanitize(text) {
      return String(text).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "");
    }

    function hasDefault(term) {
      return Object.prototype.hasOwnProperty.call(DEFAULT_TERMS, term);
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3500);
    }

    // ===== 서버 통신 (Supabase REST) =====
    async function api(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      if (res.status === 204) return null;
      return res.json().catch(() => null);
    }

    function loadLocalTerms() {
      try {
        const raw = JSON.parse(localStorage.getItem(LOCAL_TERMS_KEY) || "{}");
        return raw && typeof raw === "object" ? raw : {};
      } catch {
        return {};
      }
    }

    function saveLocalTerms(terms) {
      localStorage.setItem(LOCAL_TERMS_KEY, JSON.stringify(terms));
    }

    async function loadSharedTerms() {
      if (!USE_SERVER) {
        const fresh = {};
        for (const [term, def] of Object.entries(loadLocalTerms())) {
          if (typeof def === "string" && term && !hasDefault(term)) fresh[term] = def;
        }
        customTerms = fresh;
        allTerms = { ...DEFAULT_TERMS, ...customTerms };
        return;
      }
      const rows = await api(
        `${TABLE_URL}?select=term,definition&order=term.asc&limit=${MAX_CUSTOM_TERMS}`
      );
      const fresh = {};
      for (const row of rows || []) {
        if (typeof row.term !== "string" || typeof row.definition !== "string") continue;
        const term = sanitize(row.term).slice(0, MAX_INPUT_LEN);
        if (!term || hasDefault(term)) continue;
        fresh[term] = sanitize(row.definition).slice(0, MAX_DEFINITION_LEN);
      }
      customTerms = fresh;
      allTerms = { ...DEFAULT_TERMS, ...customTerms };
    }

    async function upsertSharedTerm(term, definition) {
      if (!USE_SERVER) {
        const t = loadLocalTerms();
        t[term] = definition;
        saveLocalTerms(t);
        return;
      }
      await api(TABLE_URL, {
        method: "POST",
        headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ term, definition, updated_at: new Date().toISOString() })
      });
    }

    async function deleteSharedTerm(term) {
      if (!USE_SERVER) {
        const t = loadLocalTerms();
        delete t[term];
        saveLocalTerms(t);
        return;
      }
      await api(`${TABLE_URL}?term=eq.${encodeURIComponent(term)}`, {
        method: "DELETE",
        headers: { Prefer: "return=minimal" }
      });
    }

    // ===== 초기화 =====
    function init() {
      setupEvents();
      updateModeUI();
      setInterval(checkIdle, 5000);
      loadSharedTerms().catch(() =>
        showToast("공유 용어를 불러오지 못했습니다. 설정(URL/키)을 확인하세요.")
      );
    }

    function setupEvents() {
      const input = document.getElementById("searchInput");
      input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
      document.getElementById("sendBtn").addEventListener("click", sendMessage);

      document.getElementById("settingsBtn").addEventListener("click", onSettingsClick);
      document.getElementById("manageBtn").addEventListener("click", openManageModal);

      document.getElementById("passwordSubmit").addEventListener("click", submitPassword);
      document.getElementById("passwordCancel").addEventListener("click", closePasswordModal);
      document.getElementById("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") submitPassword(); });

      document.getElementById("lockOk").addEventListener("click", closeLockPopup);

      document.getElementById("teachSave").addEventListener("click", saveTerm);
      document.getElementById("teachCancel").addEventListener("click", closeTeachModal);
      document.getElementById("newDefinition").addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) saveTerm();
      });

      document.getElementById("manageRefresh").addEventListener("click", refreshManageList);
      document.getElementById("manageClose").addEventListener("click", closeManageModal);

      document.getElementById("clipBtn").addEventListener("click", handleClipboard);

      const backdrops = {
        passwordModal: closePasswordModal,
        teachModal: closeTeachModal,
        manageModal: closeManageModal
      };
      for (const [id, close] of Object.entries(backdrops)) {
        document.getElementById(id).addEventListener("click", e => {
          if (e.target.id === id) close();
        });
      }

      ["click", "keydown", "touchstart"].forEach(evt =>
        document.addEventListener(evt, () => { lastActivity = Date.now(); }, { passive: true })
      );
    }

    // ===== 세션 만료 =====
    function checkIdle() {
      if (mode !== "normal" && Date.now() - lastActivity > SESSION_TIMEOUT_MS) {
        mode = "normal";
        updateModeUI();
        addAIMessage("무활동으로 Expert/Pro 세션이 만료되었습니다.", "success");
      }
    }

    // ===== 모드 / 버튼 =====
    function updateModeUI() {
      const indicator = document.getElementById("modeIndicator");
      const manageBtn = document.getElementById("manageBtn");
      indicator.className = "mode-indicator";
      if (mode === "pro") {
        indicator.textContent = "Pro";
        indicator.classList.add("pro");
        manageBtn.classList.add("show");
      } else if (mode === "expert") {
        indicator.textContent = "Expert";
        indicator.classList.add("expert");
        manageBtn.classList.remove("show");
      } else {
        indicator.textContent = "Normal";
        manageBtn.classList.remove("show");
      }
    }

    function onSettingsClick() {
      lastActivity = Date.now();
      if (mode === "pro") {
        mode = "expert";
        updateModeUI();
        addAIMessage("Pro 모드를 종료했습니다.", "success");
        return;
      }
      openPasswordModal(mode === "expert" ? "pro" : "expert");
    }

    // ===== 비밀번호 / 잠금 =====
    function loadAuthState() {
      const empty = {
        expert: { failures: 0, lockedUntil: 0 },
        pro: { failures: 0, lockedUntil: 0 }
      };
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_STATE) || "null");
        if (!s || typeof s !== "object") return empty;
        for (const role of ["expert", "pro"]) {
          const e = s[role] || {};
          empty[role].failures = Number(e.failures) || 0;
          empty[role].lockedUntil = Number(e.lockedUntil) || 0;
        }
        return empty;
      } catch {
        return empty;
      }
    }

    function saveAuthState() {
      localStorage.setItem(STORAGE_STATE, JSON.stringify(authState));
    }

    function remainingLock(role) {
      return Math.max(0, authState[role].lockedUntil - Date.now());
    }

    function lockMessage(role) {
      const sec = Math.ceil(remainingLock(role) / 1000);
      return `잠금 중입니다. ${sec}초 후에 다시 시도할 수 있습니다.`;
    }

    function openPasswordModal(role) {
      pendingRole = role;
      document.getElementById("passwordTitle").textContent =
        role === "pro" ? "Pro Access" : "Expert Access";
      document.getElementById("passwordInput").value = "";
      document.getElementById("passwordError").textContent =
        remainingLock(role) > 0 ? lockMessage(role) : "";
      document.getElementById("passwordModal").classList.add("show");
      setTimeout(() => document.getElementById("passwordInput").focus(), 100);
    }

    function closePasswordModal() {
      document.getElementById("passwordModal").classList.remove("show");
      document.getElementById("passwordInput").value = "";
      pendingRole = null;
    }

    function submitPassword() {
      if (!pendingRole) return;
      const role = pendingRole;
      lastActivity = Date.now();

      if (remainingLock(role) > 0) {
        document.getElementById("passwordError").textContent = lockMessage(role);
        return;
      }

      const input = document.getElementById("passwordInput").value;
      const expected = role === "pro" ? PRO_PASSWORD : EXPERT_PASSWORD;

      if (input === expected) {
        authState[role].failures = 0;
        authState[role].lockedUntil = 0;
        saveAuthState();
        closePasswordModal();
        if (role === "expert") {
          mode = "expert";
          showToast("expert 모드는 개발자에게 승인된 목적으로만 사용해야 합니다.");
          addAIMessage("Expert 모드에 진입했습니다.", "success");
        } else {
          mode = "pro";
          addAIMessage("Pro 모드에 진입했습니다.", "success");
        }
        updateModeUI();
        return;
      }

      authState[role].failures += 1;

      if (authState[role].failures >= MAX_WRONG_ATTEMPTS) {
        authState[role].failures = 0;
        authState[role].lockedUntil = Date.now() + LOCKOUT_SECONDS * 1000;
        saveAuthState();
        closePasswordModal();
        mode = "normal";
        updateModeUI();
        openLockPopup();
        return;
      }

      saveAuthState();
      const left = MAX_WRONG_ATTEMPTS - authState[role].failures;
      document.getElementById("passwordInput").value = "";
      document.getElementById("passwordError").textContent =
        `비밀번호가 틀렸습니다. (남은 기회: ${left}번)`;
      document.getElementById("passwordInput").focus();
    }

    function openLockPopup() {
      document.getElementById("lockPopup").classList.add("show");
      updateCountdown();
      clearInterval(countdownTimer);
      countdownTimer = setInterval(updateCountdown, 1000);
    }

    function updateCountdown() {
      const remaining = Math.max(remainingLock("expert"), remainingLock("pro"));
      const el = document.getElementById("lockCountdown");
      if (remaining > 0) {
        el.textContent = `${Math.ceil(remaining / 1000)}초 후에 다시 시도할 수 있습니다.`;
      } else {
        el.textContent = "다시 시도할 수 있습니다.";
        clearInterval(countdownTimer);
      }
    }

    function closeLockPopup() {
      document.getElementById("lockPopup").classList.remove("show");
      clearInterval(countdownTimer);
    }

    // ===== 검색 / 메시지 =====
    async function sendMessage() {
      const input = document.getElementById("searchInput");
      const query = sanitize(input.value).trim().slice(0, MAX_INPUT_LEN);
      if (!query) return;
      lastActivity = Date.now();

      document.getElementById("welcome")?.remove();
      addUserMessage(query);
      input.value = "";

      let key = findTerm(query);
      if (!key) {
        // 다른 사람이 방금 추가했을 수 있으니 한 번 더 받아옴
        try {
          await loadSharedTerms();
          key = findTerm(query);
        } catch {
          showToast("공유 용어를 새로 불러오지 못했습니다.");
        }
      }

      if (key) {
        showTerm(key);
        return;
      }

      if (mode === "expert" || mode === "pro") {
        addUnknownMessage(query);
      } else {
        addAIMessage(
          `"${query}"에 대한 정보가 없습니다. Expert 모드(⚙)에서 가르칠 수 있습니다.`,
          "error"
        );
      }
    }

    function findTerm(query) {
      if (Object.prototype.hasOwnProperty.call(allTerms, query)) return query;
      const lower = query.toLowerCase();
      return Object.keys(allTerms).find(t => t.toLowerCase() === lower) || null;
    }

    function showTerm(key) {
      const bubble = appendMessage("ai", `[${key}]\n${allTerms[key]}`, "success");
      if (mode !== "normal" && !hasDefault(key)) {
        const actions = document.createElement("div");
        actions.className = "bubble-actions";
        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "teach-link";
        edit.textContent = "수정";
        edit.addEventListener("click", () => openTeachModal(key));
        actions.appendChild(edit);
        bubble.appendChild(actions);
      }
    }

    function appendMessage(role, text, type = "normal") {
      const chat = document.getElementById("chat");
      const msg = document.createElement("div");
      msg.className = `message ${role} ${type}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      msg.appendChild(bubble);
      chat.appendChild(msg);
      scrollToBottom();
      return bubble;
    }

    function addUserMessage(text) {
      appendMessage("user", text);
    }

    function addAIMessage(text, type = "normal") {
      appendMessage("ai", text, type);
    }

    function addUnknownMessage(term) {
      const bubble = appendMessage("ai", `"${term}"에 대한 정보가 없습니다.`, "error");
      const actions = document.createElement("div");
      actions.className = "bubble-actions";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "teach-link";
      btn.textContent = "이 용어 가르치기";
      btn.addEventListener("click", () => openTeachModal(term));
      actions.appendChild(btn);
      bubble.appendChild(actions);
    }

    function scrollToBottom() {
      const chat = document.getElementById("chat");
      requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    }

    // ===== 코드 파일 분석 =====
    const MAX_FILE_BYTES = 300 * 1024;

    async function handleClipboard() {
      lastActivity = Date.now();
      let text = "";
      try {
        text = await navigator.clipboard.readText();
      } catch {
        addAIMessage("클립보드를 읽지 못했습니다. 브라우저의 클립보드 권한을 허용하고 다시 + 를 눌러 주세요.", "error");
        return;
      }

      text = sanitize(text).slice(0, MAX_FILE_BYTES);
      if (!text.trim()) {
        addAIMessage("클립보드가 비어 있습니다. 코드를 먼저 복사해 주세요.", "error");
        return;
      }

      document.getElementById("welcome")?.remove();
      addUserMessage("[클립보드 코드]");
      addAIMessage(analyzeCode(detectLanguage(text), text), "success");
    }

    function detectLanguage(text) {
      if (/<!doctype html|<html|<body|<div/i.test(text)) return "html";
      if (/system\.out\.print/i.test(text) || /public\s+(static\s+)?(class|void)/i.test(text)) return "java";
      if (/#include\s*</i.test(text) || /\bprintf\s*\(/i.test(text)) return "c";
      if (/(^|[^.\w])print\s*\(|\bdef\s+\w+\s*\(|^\s*import\s+\w+/im.test(text)) return "py";
      return "";
    }

    function analyzeCode(ext, text) {
      const langs = { py: "Python", java: "Java", html: "HTML", htm: "HTML", c: "C" };
      const lang = langs[ext];
      if (!lang) {
        return "어떤 언어의 코드인지 알 수 없습니다. Python, Java, C, HTML 코드만 분석할 수 있습니다.";
      }

      if (ext === "html" || ext === "htm") {
        return "이것은 HTML 코드입니다.\n실행하면 브라우저에 웹 페이지가 표시됩니다.";
      }

      let result = `이것은 ${lang} 코드입니다.\n`;
      const outputs = extractOutputs(ext, text);
      const caseNote = caseWarning(ext, text);
      if (outputs.length) {
        result += caseNote
          ? `주의: ${caseNote} 그대로 실행하면 오류가 나고, 고쳐서 실행하면 다음 출력물이 나옵니다:\n`
          : "실행하면 다음 출력물이 나옵니다:\n";
        result += outputs.map(o => `- ${o}`).join("\n");
      } else {
        result += "출력문을 정적으로 찾지 못했습니다. 실행해야 정확한 출력을 확인할 수 있습니다.";
      }
      return result;
    }

    function caseWarning(ext, text) {
      if (ext === "py" && /(^|[^.\w])Print\s*\(/.test(text)) {
        return "Python은 print를 소문자로 써야 합니다.";
      }
      if (ext === "java" && !/System\.out\.print/.test(text) && /system\.out\.print/i.test(text)) {
        return "Java는 System.out.println을 대소문자 그대로 써야 합니다.";
      }
      if (ext === "c" && !/\bprintf\s*\(/.test(text) && /\bprintf\s*\(/i.test(text)) {
        return "C는 printf를 소문자로 써야 합니다.";
      }
      return "";
    }

    function extractOutputs(ext, text) {
      // 문자열 리터럴로 된 출력문만 찾습니다. 변수나 f-string은 찾지 못합니다.
      const patterns = {
        py: /print\(\s*(['"])((?:\\.|(?!\1)[^\\])*)\1\s*\)/gi,
        java: /System\.out\.print(?:ln)?\(\s*"((?:\\.|[^"\\])*)"\s*\)/gi,
        c: /printf\(\s*"((?:\\.|[^"\\])*)"\s*\)/gi
      };
      const re = patterns[ext];
      if (!re) return [];

      const outputs = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        const body = ext === "py" ? m[2] : m[1];
        outputs.push(
          body
            .replace(/\\n/g, "\n")
            .replace(/\\t/g, "\t")
            .replace(/\\"/g, '"')
            .replace(/\\'/g, "'")
            .replace(/\\\\/g, "\\")
            .replace(/\s+$/, "")
        );
      }
      return outputs;
    }

    // ===== 가르치기 / 수정 =====
    function openTeachModal(word = "") {
      if (mode === "normal") {
        addAIMessage("Expert 모드에서만 사용할 수 있습니다.", "error");
        return;
      }
      lastActivity = Date.now();
      editingTerm = word && !hasDefault(word) && allTerms[word] !== undefined ? word : null;
      document.getElementById("teachTitle").textContent = editingTerm ? "Edit term" : "Teach me";
      document.getElementById("newWord").value = word;
      document.getElementById("newWord").readOnly = !!editingTerm;
      document.getElementById("newDefinition").value = editingTerm ? allTerms[editingTerm] : "";
      document.getElementById("teachError").textContent = "";
      document.getElementById("teachModal").classList.add("show");
      setTimeout(() => {
        document.getElementById(editingTerm || !word ? "newDefinition" : "newDefinition").focus();
      }, 100);
    }

    function closeTeachModal() {
      document.getElementById("teachModal").classList.remove("show");
      document.getElementById("newWord").readOnly = false;
      editingTerm = null;
    }

    async function saveTerm() {
      const word = sanitize(document.getElementById("newWord").value).trim().slice(0, MAX_INPUT_LEN);
      const definition = sanitize(document.getElementById("newDefinition").value).trim().slice(0, MAX_DEFINITION_LEN);
      const errEl = document.getElementById("teachError");

      if (!word || !definition) {
        errEl.textContent = "word와 definition을 모두 입력해 주세요.";
        return;
      }

      const existing = Object.keys(allTerms).find(k => k.toLowerCase() === word.toLowerCase());
      if (existing && hasDefault(existing)) {
        errEl.textContent = "기본 용어는 수정할 수 없습니다.";
        return;
      }
      if (!existing && Object.keys(customTerms).length >= MAX_CUSTOM_TERMS) {
        errEl.textContent = `공유 용어는 최대 ${MAX_CUSTOM_TERMS}개까지 저장할 수 있습니다.`;
        return;
      }

      const key = editingTerm || existing || word;
      errEl.textContent = "저장 중...";
      try {
        await upsertSharedTerm(key, definition);
      } catch {
        errEl.textContent = "저장에 실패했습니다. 설정이나 네트워크를 확인하세요.";
        return;
      }

      customTerms[key] = definition;
      allTerms[key] = definition;
      closeTeachModal();
      addAIMessage(
        `"${key}" 저장되었습니다. ${USE_SERVER ? "다른 사람도 이제 볼 수 있습니다." : "이 브라우저에만 저장됩니다."}`,
        "success"
      );
    }

    // ===== Pro: 용어 관리 (삭제) =====
    function openManageModal() {
      if (mode !== "pro") return;
      lastActivity = Date.now();
      renderTermsList();
      document.getElementById("manageModal").classList.add("show");
      refreshManageList();
    }

    function closeManageModal() {
      document.getElementById("manageModal").classList.remove("show");
    }

    async function refreshManageList() {
      try {
        await loadSharedTerms();
        renderTermsList();
      } catch {
        showToast("목록을 불러오지 못했습니다.");
      }
    }

    function renderTermsList() {
      const list = document.getElementById("termsList");
      list.innerHTML = "";
      const keys = Object.keys(customTerms).sort((a, b) => a.localeCompare(b));
      if (keys.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "공유 용어가 없습니다.";
        list.appendChild(empty);
        return;
      }
      for (const term of keys) {
        const row = document.createElement("div");
        row.className = "term-item";
        const name = document.createElement("span");
        name.className = "term-name";
        name.textContent = term;
        const del = document.createElement("button");
        del.type = "button";
        del.className = "term-delete-btn";
        del.textContent = "삭제";
        del.addEventListener("click", async () => {
          if (!confirm(`"${term}"을(를) 모든 사용자에게서 삭제할까요?`)) return;
          try {
            await deleteSharedTerm(term);
          } catch {
            showToast("삭제에 실패했습니다.");
            return;
          }
          delete customTerms[term];
          delete allTerms[term];
          renderTermsList();
        });
        row.appendChild(name);
        row.appendChild(del);
        list.appendChild(row);
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
